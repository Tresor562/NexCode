name: NexCode CI

on:
  push:
    branches: [main, feat/v1.5-core]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
      - run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Production dependency audit attempt ${attempt}/3"
            npm audit --omit=dev --audit-level=critical
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Production dependency audit failed after 3 attempts."
          exit "$status"
      - run: npm run validate:content
      - run: npm run audit:curriculum
      - run: npm run audit:mastery
      - run: npm run audit:bots
      - run: npm run audit:quality
      - run: npm run audit:product
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir dist
